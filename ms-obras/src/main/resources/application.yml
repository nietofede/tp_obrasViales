server:
  port: 8082

spring:
  application:
    name: ms-obras

  datasource:
    url: jdbc:postgresql://localhost:5432/ms_obras
    username: usr_obras
    password: ${OBRAS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/obras-viales