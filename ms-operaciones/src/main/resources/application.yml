server:
  port: 8084

spring:
  application:
    name: ms-operaciones
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_operaciones
    username: usr_operaciones
    password: ${OPERACIONES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/obras-viales

resilience4j:
  retry:
    instances:
      openMeteoRetry:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      openMeteoCircuitBreaker:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

app:
  open-meteo:
    url: https://api.open-meteo.com/v1/forecast
    ventana-ejecucion-horas: 6

obrasviales:
  sistema-client:
    token-url: http://localhost:8080/realms/obras-viales/protocol/openid-connect/token
    client-id: servicio-sistema
    client-secret: ${SERVICIO_SISTEMA_SECRET}